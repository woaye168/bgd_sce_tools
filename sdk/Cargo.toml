[package]
name = "bgd_sce_tools_sdk"
version = "0.1.0"
description = "bgd_sce_tools 插件 SDK：trait 与类型定义"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bgd_sce_tools_sdk"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
