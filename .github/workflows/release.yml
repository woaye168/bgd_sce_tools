name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 完整历史，用于归纳版本间提交

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $prev = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $range = if ($prev) { "$prev..$tag" } else { "$tag" }
          $commits = git log $range --pretty=format:"- %s (``%h``)" --no-merges
          $lines = @()
          $lines += "## 版本说明"
          $lines += ""
          if ($prev) { $lines += "本版本相对 ``$prev`` 的全部变更如下：" } else { $lines += "首个版本，包含全部提交：" }
          $lines += ""
          $lines += "### What's Changed"
          $lines += ""
          if ($commits) { $lines += $commits } else { $lines += "- 无代码变更" }
          $lines += ""
          if ($prev) { $lines += "**Full Changelog**: https://github.com/$repo/compare/$prev...$tag" }
          $body = $lines -join "`n"
          "body<<EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: notes

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 版本号唯一来源是 git tag：构建前把 tag 版本注入 tauri.conf.json 与 Cargo.toml
      # 源码中的 version 固定为 0.0.0-dev 占位（dev 模式使用），无需手工同步
      - name: Inject version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Write-Output "注入版本号: $ver"
          # tauri.conf.json
          $conf = Get-Content src-tauri/tauri.conf.json -Raw
          $conf = $conf -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`""
          Set-Content src-tauri/tauri.conf.json $conf -NoNewline -Encoding utf8
          # Cargo.toml（[package] 段的 version）
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]*"', "version = `"$ver`""
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline -Encoding utf8
          Write-Output "已写入 tauri.conf.json 与 Cargo.toml"

      # tauri-action 会自动：构建前端 -> 构建 Tauri 应用 ->
      # 创建 GitHub Release 并上传安装包与 updater 清单（latest.json + 签名）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bgd_sce_tools ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # 版本说明：git log 归纳版本间提交（见上方 Generate release notes）
          releaseBody: ${{ steps.notes.outputs.body }}
